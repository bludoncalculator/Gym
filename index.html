<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f3d9df">
<title>Amelia's Gym Program</title>
<style>
:root{--pink:#e9b8c5;--pink2:#f7e4e8;--deep:#9b6574;--cream:#fffaf7;--ink:#3f3437;--muted:#8b7c80;--line:#eadfe0;--white:#fff;--soft:#fbf1f3;--green:#879c8d}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Avenir Next",Inter,Arial,sans-serif}button,input,textarea{font:inherit}.app{max-width:760px;margin:auto;min-height:100vh;padding-bottom:36px}
header{padding:25px 20px 17px;background:linear-gradient(180deg,#f7e4e8 0%,var(--cream) 100%);position:relative}.kicker{font-size:11px;letter-spacing:2px;color:var(--deep);font-weight:800}.title{font-size:29px;font-weight:850;margin:7px 48px 3px 0;letter-spacing:-.8px}.sub{color:var(--muted);font-size:14px}.menuBtn{position:absolute;right:18px;top:24px;width:43px;height:43px;border:1px solid #e5cdd2;background:rgba(255,255,255,.72);border-radius:15px;color:var(--deep);display:grid;place-items:center;cursor:pointer}.menuBtn span,.menuBtn span:before,.menuBtn span:after{display:block;width:17px;height:1.7px;background:var(--deep);border-radius:2px;position:relative}.menuBtn span:before,.menuBtn span:after{content:"";position:absolute;left:0}.menuBtn span:before{top:-6px}.menuBtn span:after{top:6px}
.tabs{display:flex;gap:8px;overflow:auto;padding:14px 16px 8px;position:sticky;top:0;background:rgba(255,250,247,.94);backdrop-filter:blur(12px);z-index:5}.tab{border:1px solid var(--line);background:white;border-radius:18px;padding:9px 13px;white-space:nowrap;font-size:12px;font-weight:700;color:var(--muted)}.tab.active{background:var(--pink);border-color:var(--pink);color:#513b42}.content{padding:10px 16px}.dayhead{display:flex;justify-content:space-between;align-items:end;margin:10px 4px 14px}.dayname{font-size:22px;font-weight:850}.focus{font-size:12px;color:var(--deep);font-weight:750;text-align:right}
.card{background:white;border:1px solid var(--line);border-radius:19px;padding:16px;margin-bottom:11px;box-shadow:0 4px 18px rgba(110,70,80,.05)}.exrow{display:flex;justify-content:space-between;gap:10px}.exname{font-size:16px;font-weight:780}.meta{font-size:12px;color:var(--muted);margin-top:4px}.pill{font-size:11px;background:#f8edf0;color:var(--deep);padding:6px 9px;border-radius:12px;height:max-content;font-weight:750}.sets{margin-top:13px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.setbox{border:1px solid var(--line);border-radius:12px;padding:8px;background:#fffdfc}.setbox label{font-size:10px;color:var(--muted);display:block;margin-bottom:4px}.setbox input{width:100%;border:0;outline:0;font-size:15px;background:transparent;color:var(--ink);font-weight:700}.done{margin-top:10px;width:100%;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:750;color:var(--deep);cursor:pointer}.done.checked{background:#f4dce2;border-color:#f4dce2;color:#513b42}.rest{font-size:11px;color:var(--muted);margin-top:9px}.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.exercise-tools{display:flex;gap:8px;margin-top:10px}.toolBtn{flex:1;border:1px solid var(--line);background:#fffaf9;color:var(--deep);border-radius:12px;padding:9px 8px;font-size:11px;font-weight:750;cursor:pointer}.toolBtn.open{background:var(--soft);border-color:#efd7dc}.technique{display:none;margin-top:10px;border-top:1px solid var(--line);padding-top:12px}.technique.open{display:block}.diagram{border:1px solid #f0e2e4;background:linear-gradient(145deg,#fffaf9,#f9edf0);border-radius:16px;padding:10px;display:flex;gap:12px;align-items:center}.diagram svg{width:96px;height:120px;flex:0 0 96px}.diagramText{font-size:11px;line-height:1.45;color:var(--muted)}.diagramText strong{display:block;color:var(--ink);font-size:12px;margin-bottom:3px}.ask{margin-top:9px;padding:9px 10px;background:#fff;border:1px dashed #dfc5cc;border-radius:11px;color:var(--deep);font-size:11px;font-weight:700}.notes{display:none;margin-top:10px}.notes.open{display:block}.notes textarea{width:100%;min-height:68px;resize:vertical;border:1px solid var(--line);border-radius:12px;padding:10px;background:#fffdfc;outline:none;color:var(--ink);font-size:12px}.notes textarea:focus{border-color:#dcb4bf}.saveNote{margin-top:7px;border:0;background:var(--pink);color:#513b42;border-radius:11px;padding:8px 12px;font-size:11px;font-weight:800;cursor:pointer}.noteSaved{font-size:10px;color:var(--green);margin-left:7px}
.restCard{padding:20px;text-align:center}.heart{font-size:22px;color:var(--deep);margin-bottom:4px}.bottom{display:none}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;background:#403438;color:#fff;padding:10px 14px;border-radius:14px;font-size:12px;transition:.2s;z-index:50;pointer-events:none}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.menuOverlay{display:none;position:fixed;inset:0;background:rgba(55,39,44,.18);z-index:40}.menuOverlay.open{display:block}.menuPanel{position:absolute;right:12px;top:12px;width:min(310px,calc(100% - 24px));background:rgba(255,250,247,.98);border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px rgba(70,45,52,.18);padding:16px}.menuTop{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.menuTitle{font-weight:850;font-size:17px}.closeMenu{border:0;background:var(--soft);width:34px;height:34px;border-radius:11px;color:var(--deep);font-size:18px}.menuItem{width:100%;text-align:left;border:1px solid var(--line);background:white;border-radius:14px;padding:13px;margin-top:8px;color:var(--ink);font-weight:750}.menuItem small{display:block;color:var(--muted);font-weight:500;margin-top:3px}.menuQuote{margin:14px 4px 2px;color:var(--deep);font-size:12px;line-height:1.5;text-align:center}
.progressHero{background:linear-gradient(145deg,#f8e6ea,#fff);border:1px solid var(--line);border-radius:20px;padding:19px;margin-bottom:13px}.progressHero .big{font-size:23px;font-weight:850;margin-bottom:4px}.progressHero p{font-size:12px;color:var(--muted);line-height:1.5;margin:6px 0 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:10px 0 16px}.stat{background:white;border:1px solid var(--line);border-radius:16px;padding:13px}.num{font-size:22px;font-weight:850}.lab{font-size:10px;color:var(--muted);margin-top:3px}.sectiontitle{font-size:16px;font-weight:850;margin:20px 3px 9px}.progressrow{background:white;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px}.progressrow strong{font-size:13px}.progressrow small{display:block;color:var(--muted);margin-top:4px}.motivation{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:10px}.motivation strong{font-size:14px}.motivation p{font-size:12px;line-height:1.5;color:var(--muted);margin:7px 0 0}.backBtn{margin-top:10px!important}
.welcome{position:fixed;inset:0;background:linear-gradient(145deg,#f7e4e8,#fffaf7 70%);z-index:100;display:grid;place-items:center;text-align:center;padding:30px;transition:opacity .45s ease,visibility .45s ease}.welcome.hide{opacity:0;visibility:hidden}.welcomeInner{transform:translateY(-3vh)}.welcomeKicker{font-size:11px;letter-spacing:3px;color:var(--deep);font-weight:800;margin-bottom:12px}.welcomeTitle{font-size:42px;letter-spacing:-1.5px;font-weight:850;color:#513b42}.welcomeSub{font-size:16px;color:var(--deep);font-weight:750;margin-top:9px}.sparkle{font-size:19px;margin-bottom:10px}
@media(min-width:700px){.app{padding-top:10px}.tabs{border-radius:18px;margin:0 16px}.content{padding:10px 24px}.card{padding:18px}}
</style>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Amelia's Gym"><link rel="apple-touch-icon" href="icons/icon-192.png">
<script>if("serviceWorker"in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));}</script>
</head>
<body>
<div class="welcome" id="welcome"><div class="welcomeInner"><div class="sparkle">✦</div><div class="welcomeKicker">AMELIA'S GYM</div><div class="welcomeTitle">Welcome Mirri</div><div class="welcomeSub">You are gonna slay the gym ♡</div></div></div>
<div class="app">
<header><div class="kicker">WEEKLY ROUTINE</div><div class="title">AMELIA'S GYM PROGRAM</div><div class="sub">Train • log • progress</div><button class="menuBtn" onclick="toggleMenu()" aria-label="Open menu"><span></span></button></header>
<nav class="tabs" id="tabs"></nav><main class="content" id="content"></main>
</div>
<div class="menuOverlay" id="menuOverlay" onclick="if(event.target===this)toggleMenu()"><div class="menuPanel"><div class="menuTop"><div class="menuTitle">Your space ♡</div><button class="closeMenu" onclick="toggleMenu()">×</button></div><button class="menuItem" onclick="showProgress();toggleMenu()">♡ Progress<small>See your wins and keep building.</small></button><button class="menuItem" onclick="selectDay('Monday');toggleMenu()">✦ Weekly routine<small>Back to your workouts.</small></button><div class="menuQuote">Small steps. Strong habits. You’re doing better than you think. ✿</div></div></div>
<div class="toast" id="toast"></div>
<script>
const program={
Monday:{focus:"Glutes + Hamstrings",ex:[["Hip Thrust","4 × 8–10",4,"2–3 min","glutes","Drive through your heels and squeeze at the top."],["Bulgarian Split Squat","3 × 8–10 / leg",3,"2 min","glutes/legs","Stay tall, lower under control and push through the front foot."],["Romanian Deadlift","3 × 8–10",3,"2 min","hamstrings","Hinge at the hips and keep the weight close to your legs."],["Cable Kickback","3 × 12–15 / leg",3,"60–90 sec","glutes","Move from the hip without swinging your lower back."],["Hamstring Curl","3 × 10–15",3,"60–90 sec","hamstrings","Curl smoothly and control the return."],["Hip Abduction","3 × 15–20",3,"60–90 sec","glutes","Open the knees with control and pause briefly." ]]},
Tuesday:{focus:"Upper Body + Core",ex:[["Lat Pulldown","3 × 10–12",3,"90 sec","back","Pull elbows down toward your sides; avoid shrugging."],["Seated Cable Row","3 × 10–12",3,"90 sec","back","Sit tall, pull toward your waist and squeeze your shoulder blades."],["Dumbbell Shoulder Press","3 × 8–12",3,"90 sec","shoulders","Press smoothly overhead without over-arching your back."],["Lateral Raise","3 × 12–15",3,"60 sec","shoulders","Raise with soft elbows and control the lowering phase."],["Tricep Pushdown","3 × 12–15",3,"60–90 sec","arms","Keep elbows tucked and extend without swinging."],["Dumbbell Bicep Curl","2 × 10–15",2,"60 sec","arms","Keep elbows close and curl without using momentum."],["Cable Crunch","3 × 12–15",3,"60 sec","core","Curl your ribs toward your pelvis rather than pulling with your arms."],["Pallof Press","2 × 10–12 / side",2,"60 sec","core","Brace your core and resist being pulled sideways."]]},
Wednesday:{focus:"Hot Mat Pilates",pilates:true},
Thursday:{focus:"Glutes + Quads",ex:[["Hip Thrust","3 × 10–12",3,"2 min","glutes","Drive through your heels and squeeze at the top."],["Bulgarian Split Squat","3 × 10 / leg",3,"2 min","glutes/legs","Stay tall, lower under control and push through the front foot."],["Leg Press","3 × 10–12",3,"2 min","quads/glutes","Keep your feet planted and lower only as far as you can control."],["Reverse Lunge","3 × 10 / leg",3,"90 sec","legs/glutes","Step back softly and drive through the front foot to stand."],["Leg Extension","2 × 12–15",2,"60–90 sec","quads","Move smoothly and squeeze the quads near the top."],["Hip Abduction","3 × 15–20",3,"60–90 sec","glutes","Open the knees with control and pause briefly."],["Cable Kickback","2 × 15 / leg",2,"60–90 sec","glutes","Move from the hip without swinging your lower back."]]},
Friday:{focus:"Hot Mat Pilates / Walk",pilates:true,friday:true},Saturday:{focus:"Recovery / Walk",recovery:true},Sunday:{focus:"Rest",rest:true}};
const days=Object.keys(program);let selected=localStorage.getItem("ameliaDay")||"Monday";
function key(d,i,s){return `amelia_${d}_${i}_${s}`}function noteKey(d,i){return `amelia_note_${d}_${i}`}
function renderTabs(){document.getElementById("tabs").innerHTML=days.map(d=>`<button class="tab ${d===selected?'active':''}" onclick="selectDay('${d}')">${d.slice(0,3).toUpperCase()}</button>`).join("")}
function selectDay(d){selected=d;localStorage.setItem("ameliaDay",d);renderTabs();renderDay();window.scrollTo({top:0,behavior:'smooth'})}
function diagram(ex){const m=ex[4]||"full body";const body=`<svg viewBox="0 0 100 125" aria-label="Technique diagram"><circle cx="50" cy="15" r="8" fill="#fff" stroke="#9b6574" stroke-width="2"/><path d="M42 25 Q50 21 58 25 L62 50 Q59 58 56 67 L62 104 M44 25 L38 51 L31 70 M44 52 L39 72 L38 103 M56 52 L61 72 L62 103 M39 33 L28 48 M61 33 L72 48" fill="none" stroke="#9b6574" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="${m.includes('glute')||m.includes('legs')? 'M39 54 Q50 61 61 54 L58 69 Q50 75 42 69 Z':''}${m.includes('hamstring')?'M42 68 L49 68 L46 92 L39 91 Z M51 68 L58 68 L61 91 L54 92 Z':''}${m.includes('quad')?'M39 68 L49 69 L46 94 L38 94 Z M51 69 L61 68 L62 94 L54 94 Z':''}${m.includes('back')?'M43 28 Q50 24 57 28 L59 54 Q50 61 41 54 Z':''}${m.includes('shoulder')?'M37 28 Q32 27 29 34 L37 39 L43 32 Z M63 28 Q68 27 71 34 L63 39 L57 32 Z':''}${m.includes('arms')?'M37 30 L27 48 L31 51 L43 35 Z M63 30 L73 48 L69 51 L57 35 Z':''}${m.includes('core')?'M43 38 Q50 43 57 38 L56 57 Q50 62 44 57 Z':''}" fill="#e9b8c5" opacity=".9"/></svg>`;return `<div class="diagram">${body}<div class="diagramText"><strong>How it should feel</strong>${ex[5]}<div class="ask">♡ If you don't know how to do it, ask Ruri.</div></div></div>`}
function renderDay(){const p=program[selected],c=document.getElementById("content");let html=`<div class="dayhead"><div class="dayname">${selected}</div><div class="focus">${p.focus}</div></div>`;
if(p.ex){p.ex.forEach((e,i)=>{let boxes="";for(let s=0;s<e[2];s++){let v=localStorage.getItem(key(selected,i,s))||"";boxes+=`<div class="setbox"><label>SET ${s+1} · KG</label><input inputmode="decimal" value="${v}" onchange="save('${selected}',${i},${s},this.value)" placeholder="—"></div>`}let done=localStorage.getItem('done_'+selected+'_'+i)==='1';let note=(localStorage.getItem(noteKey(selected,i))||'').replace(/</g,'&lt;');html+=`<div class="card"><div class="exrow"><div><div class="exname">${e[0]}</div><div class="meta">${e[1]}</div></div><div class="pill">${e[2]} sets</div></div><div class="sets">${boxes}</div><div class="rest">Rest: ${e[3]}</div><button id="done_${i}" class="done ${done?'checked':''}" onclick="toggleDone(${i})">${done?'✓ Completed':'Mark exercise complete'}</button><div class="exercise-tools"><button class="toolBtn" onclick="toggleTechnique(${i})">♡ How to do it</button><button class="toolBtn" onclick="toggleNotes(${i})">✎ Notes</button></div><div class="technique" id="tech_${i}">${diagram(e)}</div><div class="notes" id="notes_${i}"><textarea id="note_${i}" placeholder="Add a note for next time…">${note}</textarea><div><button class="saveNote" onclick="saveNote(${i})">Save note</button><span class="noteSaved" id="noteSaved_${i}"></span></div></div></div>`})}
else if(p.pilates){html+=`<div class="card restCard"><div class="heart">✿</div><div class="exname">45–60 min Hot Mat Pilates</div><div class="meta">Core • glutes • mobility • control</div><div class="rest">${p.friday?'Or take an easy walk if you want a lighter day.':'Keep it controlled and comfortable — no strict sets/reps needed.'}</div></div>`}
else if(p.recovery){html+=`<div class="card restCard"><div class="heart">♡</div><div class="exname">Easy recovery</div><div class="meta">Easy walk, mobility or complete rest</div></div>`}
else if(p.rest){html+=`<div class="card restCard"><div class="heart">♡</div><div class="exname">Rest day</div><div class="meta">Recover and come back fresh.</div></div>`}
if(selected==="Tuesday")html+=`<div class="card"><div class="exrow"><div><div class="exname">StairMaster</div><div class="meta">15–20 min · moderate pace</div></div><div class="pill">CARDIO</div></div><div class="exercise-tools"><button class="toolBtn" onclick="toggleNotes('stair')">✎ Notes</button></div><div class="notes" id="notes_stair"><textarea id="note_stair" placeholder="How did it feel today?">${(localStorage.getItem(noteKey('Tuesday','stair'))||'').replace(/</g,'&lt;')}</textarea><div><button class="saveNote" onclick="saveNote('stair')">Save note</button></div></div></div>`;
html+=`<div class="card"><div class="exname">Progression ♡</div><div class="meta">When you can hit the top of the rep range with good form, increase the weight slightly next time. You don't need to rush it.</div></div>`;c.innerHTML=html}
function save(d,i,s,v){localStorage.setItem(key(d,i,s),v);toast("Saved ♡")}function toggleDone(i){let k='done_'+selected+'_'+i,v=localStorage.getItem(k)==='1'?'0':'1';localStorage.setItem(k,v);renderDay()}
function toggleTechnique(i){document.getElementById('tech_'+i).classList.toggle('open')}function toggleNotes(i){document.getElementById('notes_'+i).classList.toggle('open')}
function saveNote(i){let k=noteKey(selected,i);localStorage.setItem(k,document.getElementById('note_'+i).value);let x=document.getElementById('noteSaved_'+i);if(x)x.textContent='Saved ♡';toast('Note saved ♡')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),900)}
function toggleMenu(){document.getElementById('menuOverlay').classList.toggle('open')}
function showProgress(){let sessions=0,exercises=0;days.forEach(d=>{let count=program[d].ex?.filter((_,i)=>localStorage.getItem('done_'+d+'_'+i)==='1').length||0;if(count)sessions++;exercises+=count});let c=document.getElementById('content');c.innerHTML=`<div class="dayhead"><div class="dayname">Progress ♡</div><div class="focus">Look at you go.</div></div><div class="progressHero"><div class="big">You’re doing so well, Mirri ✿</div><p>Progress isn't about being perfect. It's about showing up, learning your movements, and getting a little stronger and more confident over time.</p></div><div class="stats"><div class="stat"><div class="num">${sessions}</div><div class="lab">workout days logged</div></div><div class="stat"><div class="num">${exercises}</div><div class="lab">exercises completed</div></div><div class="stat"><div class="num">${days.length}</div><div class="lab">days in your routine</div></div></div><div class="sectiontitle">Your week</div>${days.map(d=>`<div class="progressrow"><strong>${d}</strong><small>${program[d].focus}</small></div>`).join('')}<div class="motivation"><strong>Keep going, gorgeous ♡</strong><p>Some days will feel amazing and some won't. Both count. Keep your form clean, add weight when you're ready, and remember why you started.</p></div><button class="done backBtn" onclick="renderTabs();renderDay()">← Back to ${selected}</button>`}
setTimeout(()=>document.getElementById('welcome').classList.add('hide'),1700);renderTabs();renderDay();
</script></body></html>
